<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer contraseña | Oh Happy Trip</title>
  <link rel="icon" type="image/png" href="./static/img/ohHappyTripLogo.png">
  <link rel="stylesheet" href="./static/css/style.css">
</head>
<body class="fondo">
  <main class="auth-contenedor">
    <div class="auth-card">
      <img src="./static/img/ohHappyTripLogo.png" alt="Oh Happy Trip" class="auth-logo">
      <p class="inicio-eyebrow">Seguridad de la cuenta</p>
      <h1>Restablecer contraseña</h1>
      <form id="resetPasswordForm">
        <label for="nuevaPassword">Nueva contraseña</label>
        <input id="nuevaPassword" type="password" minlength="6" required autocomplete="new-password">
        <label for="confirmarPassword">Confirmar contraseña</label>
        <input id="confirmarPassword" type="password" minlength="6" required autocomplete="new-password">
        <button class="btn-guardar" type="submit">Guardar contraseña</button>
        <p id="resetMensaje" class="auth-mensaje" role="status"></p>
      </form>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
